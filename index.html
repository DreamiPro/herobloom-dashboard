<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeroBloom · valdymo pultas</title>
<style>
  :root{
    --bg:#0b0d13;
    --surface:#12151f;
    --surface2:#171b28;
    --surface3:#1d2233;
    --line:#242a3d;
    --line2:#2e3550;
    --ink:#eceff7;
    --ink2:#c3c9db;
    --muted:#7e879e;
    --faint:#5b647d;
    --blue:#4c9aff;
    --violet:#a78bfa;
    --green:#34d399;
    --gold:#fbbf24;
    --pink:#f472b6;
    --cyan:#22d3ee;
    --coral:#fb7185;
    --primary:#4c9aff;
    --primaryInk:#04121f;
    --radius:16px;
    /*logo*/
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 1;
  }
  a{color:var(--primary);text-decoration:none}
  button{cursor:pointer;font-family:inherit;color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg)}

  /* ---------- Prisijungimas ---------- */
  #login{max-width:390px;margin:11vh auto;padding:0 20px}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 28px;box-shadow:var(--sh)}
  .brandmark{display:flex;align-items:center;gap:11px;margin-bottom:22px}
  .brandmark .glyph{overflow:hidden;width:38px;height:38px;border-radius:11px;background:transparent;display:grid;place-items:center}
  .brandmark b{font-size:1.15rem;letter-spacing:-.01em}
  .brandmark span{display:block;font-size:.72rem;color:var(--muted);font-weight:500;margin-top:1px}
  #login h1{font-size:1.15rem;margin:0 0 4px}
  #login p{color:var(--muted);margin:0 0 20px;font-size:.9rem}
  label{display:block;font-size:.78rem;color:var(--ink2);margin:14px 0 6px;font-weight:500}
  input,select{width:100%;padding:11px 13px;background:var(--surface2);border:1px solid var(--line2);border-radius:11px;color:var(--ink);font-size:.94rem;transition:border-color .15s}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(76,154,255,.15)}
  .btn{background:var(--primary);color:var(--primaryInk);border:none;border-radius:11px;padding:11px 16px;font-weight:700;font-size:.92rem;transition:filter .15s,transform .05s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line2);font-weight:600}
  .btn.ghost:hover{background:var(--surface3);filter:none}
  .btn.gold{background:var(--gold);color:#3a2a00}
  .btn.danger{background:transparent;color:var(--coral);border:1px solid rgba(251,113,133,.4)}
  .btn.danger:hover{background:rgba(251,113,133,.1);filter:none}
  .btn.sm{padding:8px 12px;font-size:.83rem;border-radius:9px}
  .err{color:var(--coral);font-size:.84rem;margin-top:12px;min-height:1em}

  /* ---------- Karkasas ---------- */
  #app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  aside .top{padding:20px 18px 8px}
  aside nav{padding:8px 12px;flex:1;display:flex;flex-direction:column;gap:2px}
  .navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:.9rem;font-weight:500;background:none;border:none;width:100%;text-align:left;transition:background .12s,color .12s}
  .navitem:hover{background:var(--surface2);color:var(--ink2)}
  .navitem.on{background:var(--surface3);color:var(--ink);font-weight:600}
  .navitem.on svg{color:var(--primary)}
  .navitem svg{width:18px;height:18px;flex-shrink:0;color:var(--faint)}
  .navitem .cnt{margin-left:auto;font-size:.72rem;color:var(--faint);background:var(--surface2);padding:1px 7px;border-radius:20px}
  aside .who{padding:14px 16px;border-top:1px solid var(--line);font-size:.8rem}
  aside .who .em{color:var(--ink2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  aside .who .out{color:var(--muted);margin-top:7px;display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:0;font-size:.8rem}
  aside .who .out:hover{color:var(--coral)}

  main{min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:14px;padding:20px 30px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,13,19,.82);backdrop-filter:blur(8px);z-index:5}
  .topbar h1{font-size:1.28rem;margin:0;letter-spacing:-.01em}
  .topbar .sub{color:var(--muted);font-size:.82rem;margin-top:2px}
  .topbar .spacer{flex:1}
  .icon-btn{width:38px;height:38px;border-radius:10px;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--ink2)}
  .icon-btn:hover{background:var(--surface3)} .icon-btn svg{width:17px;height:17px}
  .content{padding:26px 30px 70px}

  /* ---------- Bento / kortelės ---------- */
  .bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
  .card.pad0{padding:0}
  .card h3{margin:0 0 2px;font-size:.95rem;font-weight:600}
  .card .h3sub{color:var(--muted);font-size:.78rem;margin-bottom:14px}
  .c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
  .c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
  @media(max-width:1080px){.c3{grid-column:span 6}.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}}
  @media(max-width:640px){.bento>*{grid-column:span 12!important}}

  .kpi{display:flex;flex-direction:column;gap:10px}
  .kpi .lab{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.8rem;font-weight:500}
  .kpi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
  .kpi .ic svg{width:16px;height:16px}
  .kpi .val{font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1}
  .kpi .meta{font-size:.78rem;color:var(--muted)}
  .kpi .meta b{color:var(--ink2);font-weight:600}

  .statlist{display:flex;flex-direction:column}
  .statrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .statrow:first-child{border-top:none}
  .statrow .d{width:9px;height:9px;border-radius:3px;flex-shrink:0}
  .statrow .n{font-size:.88rem;color:var(--ink2)}
  .statrow .v{margin-left:auto;font-weight:700;font-size:.95rem}
  .statrow .v small{color:var(--muted);font-weight:500;font-size:.76rem;margin-left:4px}

  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.87rem}
  thead th{text-align:left;padding:11px 14px;color:var(--muted);font-weight:600;font-size:.73rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);background:var(--surface)}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--surface2)}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  code{background:var(--surface3);padding:2px 7px;border-radius:6px;font-size:.8rem;font-family:"SF Mono",ui-monospace,Menlo,monospace;color:var(--cyan)}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:7px}
  .badge.on{background:rgba(52,211,153,.14);color:var(--green)}
  .badge.off{background:var(--surface3);color:var(--muted)}
  .avatar{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;font-size:.72rem;font-weight:800;color:#fff;flex-shrink:0}
  .fam-cell{display:flex;align-items:center;gap:10px}

  .seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:none;background:none;color:var(--muted);padding:7px 13px;border-radius:8px;font-size:.85rem;font-weight:600}
  .seg button.on{background:var(--primary);color:var(--primaryInk)}
  .bosschips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .bosscard{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line2);border-radius:12px;background:var(--surface2);text-align:left;transition:border-color .12s,background .12s}
  .bosscard:hover{background:var(--surface3)}
  .bosscard.on{border-color:var(--primary);background:rgba(76,154,255,.1)}
  .bosscard .bimg{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex-shrink:0;background:var(--surface3)}
  .bosscard .bn{display:block;font-weight:600;font-size:.9rem;line-height:1.25}
  .bosscard .bk{display:block;font-size:.74rem;color:var(--muted);margin-top:2px}

  .field-lbl{font-size:.78rem;color:var(--ink2);font-weight:500;margin:18px 0 8px}
  .info{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:.85rem;color:var(--ink2);display:flex;gap:11px}
  .info svg{width:18px;height:18px;color:var(--primary);flex-shrink:0;margin-top:1px}
  .tagpill{display:inline-block;background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:4px 10px;font-size:.8rem;margin:3px}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--surface2)}
  .switch .nm{font-weight:600;font-size:.9rem} .switch .ky{font-size:.76rem;color:var(--muted);margin-top:2px}
  .tgl{width:44px;height:26px;border-radius:20px;background:var(--surface3);border:1px solid var(--line2);position:relative;transition:background .15s;flex-shrink:0}
  .tgl::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--muted);top:2px;left:2px;transition:transform .18s,background .15s}
  .tgl.on{background:rgba(52,211,153,.25);border-color:var(--green)} .tgl.on::after{transform:translateX(18px);background:var(--green)}

  .empty{text-align:center;color:var(--muted);padding:40px 20px}
  .empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:10px}
  .hidden{display:none}
  .spin{width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);background:var(--surface3);border:1px solid var(--line2);border-radius:12px;padding:13px 20px;font-size:.9rem;box-shadow:var(--sh);opacity:0;transition:opacity .2s,transform .2s;z-index:50;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .skel{background:linear-gradient(90deg,var(--surface2),var(--surface3),var(--surface2));background-size:200% 100%;animation:sk 1.3s infinite;border-radius:8px}
  @keyframes sk{to{background-position:-200% 0}}
.brandmark .glyph img{width:100%;height:100%;object-fit:contain;display:block}
</style>
</head>

async function doLogin(){
  const email=$('email').value.trim(), pass=$('pass').value;
  $('loginErr').textContent=''; $('loginBtn').innerHTML='<span class="spin"></span>';
  const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
  $('loginBtn').textContent='Prisijungti';
  if(error){ $('loginErr').textContent=klaida(error.message); return; }
  if(!data.user || (data.user.email||'').toLowerCase()!==ADMIN_EMAIL){ await sb.auth.signOut(); $('loginErr').textContent='Ši paskyra neturi admino teisių.'; return; }
  enterApp();
}
function klaida(m){ m=(m||'').toLowerCase();
  if(m.includes('invalid login')) return 'Neteisingas el. paštas arba slaptažodis.';
  if(m.includes('email not confirmed')) return 'El. paštas dar nepatvirtintas.';
  if(m.includes('network')||m.includes('fetch')) return 'Nepavyko pasiekti serverio (patikrink internetą).';
  return 'Klaida: '+m;
}
async function logout(){ await sb.auth.signOut(); location.reload(); }
async function enterApp(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('whoEmail').textContent=ADMIN_EMAIL; buildNav(); await loadAll(); }

function buildNav(){
  const n=$('nav'); n.innerHTML='';
  PAGES.forEach(p=>{
    const b=el('button','navitem'+(p.id===CURTAB?' on':''), svg(p.icon)+'<span>'+esc(p.t)+'</span>');
    b.dataset.t=p.id; b.onclick=()=>{ CURTAB=p.id; [...n.children].forEach(x=>x.classList.toggle('on',x.dataset.t===p.id)); render(); };
    n.appendChild(b);
  });
}

/* ====================== STATISTIKA ====================== */
function computeStats(d){
  const fams=(d.families||[]), memRows=(d.members||[]), ents=(d.entitlements||[]);
  const now=Date.now();
  const s={ famCount:fams.length, heroesCount:d.heroesCount||0, members:0,parents:0,kids:0,
    active24:0,active7:0,active30:0, gold:0,xp:0,tasksCreated:0,tasksDone:0,
    pvpFights:0,pvpWins:0,bossKills:0,purchases:0,behGood:0,behBad:0,achUnlocked:0,quizAnswers:0,rareTrophies:0,withFriends:0,
    mod:{tasks:0,quiz:0,pvp:0,boss:0,shop:0,beh:0,ach:0,friends:0},
    kidTasks:0,kidGold:0,kidXp:0,kidLevelSum:0,kidCount:0,
    accounts:new Set(), familyRows:[], signupDays:{}, activeDays:{}, ents };
  fams.forEach(f=>{
    const data=f.data||{}, mems=Array.isArray(data.members)?data.members:[];
    const up=f.updated_at?new Date(f.updated_at).getTime():0;
    if(up){ if(now-up<864e5)s.active24++; if(now-up<7*864e5)s.active7++; if(now-up<30*864e5)s.active30++;
      const dk=new Date(up).toISOString().slice(0,10); s.activeDays[dk]=(s.activeDays[dk]||0)+1; }
    if(f.owner_email) s.accounts.add(f.owner_email.toLowerCase());
    s.tasksCreated+=Array.isArray(data.tasks)?data.tasks.length:0;
    s.purchases+=Array.isArray(data.purchases)?data.purchases.length:0;
    const qs=(data.settings&&data.settings.quizStats)||{};
    const famQuiz=Object.values(qs).reduce((a,q)=>a+((q&&q.seen)||0),0); s.quizAnswers+=famQuiz;
    const evLog=data.eventLog||{}; const famTroph=Object.values(evLog).filter(v=>v&&v!=='missed').length; s.rareTrophies+=famTroph;
    let fTasks=0,fPvp=0,fBoss=0,fBeh=0;
    mems.forEach(m=>{
      s.members++; const p=!!m.parent; if(p)s.parents++;else s.kids++;
      s.gold+=(+m.gold||0); s.xp+=(+m.xp||0);
      const t=m.tally||{};
      fTasks+=(+t.tasksDone||0); fPvp+=(+t.pvpFights||0); s.pvpWins+=(+t.pvpWins||0); fBoss+=(+t.bossKills||0);
      fBeh+=((+t.behGood||0)+(+t.behBad||0)); s.behGood+=(+t.behGood||0); s.behBad+=(+t.behBad||0);
      s.achUnlocked+=m.ach?Object.keys(m.ach).length:0;
      if(Array.isArray(m.friends)&&m.friends.length)s.withFriends++;
      if(m.email)s.accounts.add(String(m.email).toLowerCase());
      if(!p){s.kidCount++;s.kidTasks+=(+t.tasksDone||0);s.kidGold+=(+m.gold||0);s.kidXp+=(+m.xp||0);s.kidLevelSum+=(+m.level||1);}
    });
    s.tasksDone+=fTasks; s.pvpFights+=fPvp; s.bossKills+=fBoss;
    if((Array.isArray(data.tasks)?data.tasks.length:0)>0)s.mod.tasks++;
    if(famQuiz>0)s.mod.quiz++; if(fPvp>0)s.mod.pvp++;
    if(fBoss>0||famTroph>0||(data.boss&&data.boss.contrib&&Object.keys(data.boss.contrib).length))s.mod.boss++;
    if((Array.isArray(data.purchases)?data.purchases.length:0)>0)s.mod.shop++;
    if(fBeh>0)s.mod.beh++;
    if(mems.some(m=>m.ach&&Object.keys(m.ach).length))s.mod.ach++;
    if(mems.some(m=>Array.isArray(m.friends)&&m.friends.length))s.mod.friends++;
    s.familyRows.push({ code:f.code,name:data.familyName||'—',members:mems.length,
      parents:mems.filter(m=>m.parent).length,kids:mems.filter(m=>!m.parent).length,
      gold:mems.reduce((a,m)=>a+(+m.gold||0),0),tasksDone:fTasks,updated:up,owner:f.owner_email||'',
      ents:ents.filter(e=>e.family_code===f.code&&e.enabled).map(e=>e.feature) });
  });
  memRows.forEach(m=>{ if(m.created_at){const dk=new Date(m.created_at).toISOString().slice(0,10); s.signupDays[dk]=(s.signupDays[dk]||0)+1;} });
  s.accountsCount=s.accounts.size;
  s.paying=new Set(ents.filter(e=>e.enabled).map(e=>e.family_code)).size;
  s.familyRows.sort((a,b)=>b.updated-a.updated);
  s.acctSeries=buildCumulative(s.signupDays);
  s.activeSeries=buildLastDays(s.activeDays,30);
  return s;
}
function buildCumulative(byDay){
  const days=Object.keys(byDay).sort(); if(!days.length)return [];
  const start=new Date(days[0]), end=new Date(); let cum=0; const out=[];
  for(let dt=new Date(start); dt<=end; dt.setDate(dt.getDate()+1)){
    const k=dt.toISOString().slice(0,10); cum+=(byDay[k]||0); out.push({x:k,y:cum});
    if(out.length>120)break;
  }
  return out;
}
function buildLastDays(byDay,n){
  const out=[]; const end=new Date();
  for(let i=n-1;i>=0;i--){ const dt=new Date(end); dt.setDate(dt.getDate()-i); const k=dt.toISOString().slice(0,10); out.push({x:k,y:byDay[k]||0}); }
  return out;
}

function mkBar(node,cats,values,colors,horizontal){
  if(!window.ApexCharts||!node)return;
  const distributed=!!(colors&&colors.length);
  const c=new ApexCharts(node,{...AX_BASE,
    chart:{...AX_BASE.chart,type:'bar',height:Math.max(200,horizontal?cats.length*38+40:240)},
    series:[{name:'Šeimų',data:values}],
    plotOptions:{bar:{horizontal:!!horizontal,borderRadius:6,borderRadiusApplication:'end',barHeight:'62%',columnWidth:'55%',distributed}},
    colors:distributed?colors:['#4c9aff'],
    xaxis:{categories:cats,labels:{style:{colors:'#5b647d',fontSize:'11px'}},axisBorder:{show:false},axisTicks:{show:false}},
    yaxis:{labels:{style:{colors:'#8a92a6',fontSize:'12px'}}},
    legend:{show:false}, tooltip:{theme:'dark',y:{formatter:v=>fmt(v)}}
  });
  c.render(); CHARTS.push(c);
}
function mkHours(node,byHour){
  if(!window.ApexCharts||!node)return;
  const data=[]; for(let h=0;h<24;h++)data.push(byHour[h]||0);
  const cats=[]; for(let h=0;h<24;h++)cats.push(h%2===0?String(h):'');
  const c=new ApexCharts(node,{...AX_BASE,
    chart:{...AX_BASE.chart,type:'bar',height:220},
    series:[{name:'Veiksmai',data}], colors:['#a78bfa'],
    plotOptions:{bar:{borderRadius:3,columnWidth:'70%'}},
    xaxis:{categories:cats,labels:{style:{colors:'#5b647d',fontSize:'10px'}},axisBorder:{show:false},axisTicks:{show:false}},
    yaxis:{labels:{style:{colors:'#5b647d',fontSize:'11px'}}},

}

    });

function relTime(ts){
  const diff=Date.now()-ts, d=Math.floor(diff/864e5);
  if(diff<36e5) return 'prieš '+Math.max(1,Math.floor(diff/6e4))+' min';
  if(d<1) return 'prieš '+Math.floor(diff/36e5)+' val.';
  if(d===1) return 'vakar';
  if(d<30) return 'prieš '+d+' d.';
  return new Date(ts).toLocaleDateString('lt-LT');
}

function drawBoss(cv,rects,size){ if(!cv)return; const c=cv.getContext('2d'); const px=size/32; c.clearRect(0,0,size,size); (rects||[]).forEach(r=>{ c.fillStyle=r.color; c.fillRect(r.x*px,r.y*px,Math.ceil(r.w*px)+0.3,Math.ceil(r.h*px)+0.3); }); }
function allBosses(){ const out=[];
  (BUILTIN_BOSSES.standard||[]).forEach(b=>out.push({kind:'standard',builtin:true,name:b.name,rects:b.rects}));
  (BUILTIN_BOSSES.event||[]).forEach(b=>out.push({kind:'event',builtin:true,key:b.key,name:b.name,desc:b.desc,hp:b.hp,rects:b.rects}));
  (CUSTOM_BOSSES||[]).forEach(row=>{ const d=row.def||{}; out.push({kind:(d.type==='standard'?'standard':'event'),custom:true,id:row.id,key:d.key,name:d.name,desc:d.desc,hp:d.hp,emo:d.emo,taunts:d.taunts,rects:d.rects||[]}); });
  return out; }
function summonable(){ return allBosses().filter(b=>b.kind==='event'); }

async function renderBoss(v){
  v.innerHTML='<div class="card"><div class="empty"><span class="spin"></span> Kraunama…</div></div>';

  v.innerHTML='';

  const tools=el('div'); tools.style.cssText='display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px';
  const mkTool=(lbl,on,fn)=>{ const b=el('button','btn sm'+(on?' gold':''),lbl); b.onclick=fn; return b; };
  tools.appendChild(mkTool('✏️ Piešti',ED.tool==='paint',()=>{ED.tool='paint';bossCreate(v);}));
  tools.appendChild(mkTool('🧽 Trinti',ED.tool==='erase',()=>{ED.tool='erase';bossCreate(v);}));
  tools.appendChild(mkTool('🪞 Veidrodis',ED.mirror,()=>{ED.mirror=!ED.mirror;bossCreate(v);}));
  tools.appendChild(mkTool('↶ Atgal',false,()=>{ if(ED.undo.length){ED.px=ED.undo.pop();bossCreate(v);} }));
  tools.appendChild(mkTool('🗑 Valyti',false,()=>{ if(confirm('Išvalyti piešinį?')){edReset();bossCreate(v);} }));
  left.appendChild(tools);
  const sw=el('div'); sw.style.cssText='display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;align-items:center';
  PAL.forEach(col=>{ const b=el('button'); b.style.cssText='width:24px;height:24px;border-radius:6px;border:2px solid '+(ED.color===col?'#fff':'transparent')+';background:'+col; b.onclick=()=>{ED.color=col;ED.tool='paint';bossCreate(v);}; sw.appendChild(b); });
  const custom=el('input'); custom.type='color'; custom.value=ED.color; custom.style.cssText='width:30px;height:30px;padding:0;border:1px solid var(--line2);border-radius:6px;background:none;cursor:pointer'; custom.oninput=e=>{ED.color=e.target.value;ED.tool='paint';}; sw.appendChild(custom);
  left.appendChild(sw);
  const cv=el('canvas'); cv.width=384; cv.height=384; cv.style.cssText='image-rendering:pixelated;cursor:crosshair;border:1px solid var(--line2);border-radius:10px;touch-action:none;background:#0e111a;display:block';
  left.appendChild(cv);
  wrap.appendChild(left);
  const redraw=()=>{ const c=cv.getContext('2d'); c.clearRect(0,0,384,384); for(let y=0;y<32;y++)for(let x=0;x<32;x++){ if(ED.px[y][x]){c.fillStyle=ED.px[y][x];c.fillRect(x*12,y*12,12,12);} } c.strokeStyle='rgba(255,255,255,.05)'; for(let i=0;i<=32;i++){c.beginPath();c.moveTo(i*12,0);c.lineTo(i*12,384);c.stroke();c.beginPath();c.moveTo(0,i*12);c.lineTo(384,i*12);c.stroke();} c.strokeStyle='rgba(76,154,255,.25)';c.beginPath();c.moveTo(192,0);c.lineTo(192,384);c.stroke(); };
  let drawing=false;
  const cellAt=e=>{ const r=cv.getBoundingClientRect(); return {x:Math.floor((e.clientX-r.left)/(r.width/32)), y:Math.floor((e.clientY-r.top)/(r.height/32))}; };
  const paint=(x,y)=>{ if(x<0||x>=32||y<0||y>=32)return; const val=ED.tool==='erase'?null:ED.color; ED.px[y][x]=val; if(ED.mirror)ED.px[y][31-x]=val; };
  cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); drawing=true; ED.undo.push(ED.px.map(r=>r.slice())); if(ED.undo.length>40)ED.undo.shift(); const p=cellAt(e); paint(p.x,p.y); redraw(); });
  cv.addEventListener('pointermove',e=>{ if(!drawing)return; const p=cellAt(e); paint(p.x,p.y); redraw(); });
  cv.addEventListener('pointerup',()=>{drawing=false; syncPreview();});
  cv.addEventListener('pointerleave',()=>{ if(drawing){drawing=false; syncPreview();} });
  redraw();
  const right=el('div');
  const seg=el('div','seg'); seg.style.width='100%';
  [['event','Retas (iškviečiamas)'],['standard','Standartinis']].forEach(pair=>{ const b=el('button',ED.type===pair[0]?'on':'',pair[1]); b.style.flex='1'; b.onclick=()=>{ED.type=pair[0];bossCreate(v);}; seg.appendChild(b); });
  right.appendChild(seg);
  const field=(lbl,node)=>{ right.appendChild(el('div','field-lbl',lbl)); right.appendChild(node); };
  const nm=el('input'); nm.type='text'; nm.placeholder='pvz. Dulkių Siaubūnas'; nm.value=ED.name; nm.maxLength=40; nm.oninput=e=>ED.name=e.target.value; field('Pavadinimas',nm);
  const ds=el('textarea'); ds.placeholder='1–2 sakiniai (rodoma žaidėjui)'; ds.value=ED.desc; ds.style.minHeight='56px'; ds.oninput=e=>ED.desc=e.target.value; field('Aprašymas',ds);
  if(ED.type==='event'){
    const hp=el('input'); hp.type='number'; hp.value=ED.hp; hp.min=50; hp.max=2000; hp.step=50; hp.oninput=e=>ED.hp=+e.target.value; field('Gyvybės',hp);
    const emo=el('input'); emo.type='text'; emo.value=ED.emo; emo.maxLength=4; emo.oninput=e=>ED.emo=e.target.value; field('Ikona (emoji)',emo);
  }
  const pv=el('div'); pv.style.cssText='margin-top:16px;background:#0e111a;border:1px solid var(--line2);border-radius:12px;padding:16px;display:flex;justify-content:center';
  pv.innerHTML='<canvas width="140" height="140" style="image-rendering:pixelated"></canvas>';
  right.appendChild(el('div','field-lbl','Peržiūra')); right.appendChild(pv);
  const rects=()=>{ const rr=[]; for(let y=0;y<32;y++){let x=0;while(x<32){const c=ED.px[y][x];if(!c){x++;continue;}let w=1;while(x+w<32&&ED.px[y][x+w]===c)w++;rr.push({x,y,w,h:1,color:c});x+=w;}} return rr; };
  function syncPreview(){ drawBoss(pv.querySelector('canvas'), [{x:3,y:30,w:26,h:2,color:'rgba(0,0,0,.22)'}].concat(rects()), 140); }
  syncPreview();
  const save=el('button','btn gold','💾 Išsaugoti bosą'); save.style.cssText='width:100%;margin-top:18px;justify-content:center';
  save.onclick=async()=>{
    const r=rects(); if(!r.length){toast('Pirma nupiešk bosą');return;}
    if(!ED.name.trim()){toast('Įrašyk pavadinimą');return;}
    const key=(ED.name.trim().toLowerCase().replace(/[ąčęėįšųūž]/g,c=>({'ą':'a','č':'c','ę':'e','ė':'e','į':'i','š':'s','ų':'u','ū':'u','ž':'z'}[c]||c)).replace(/[^a-z0-9]/g,'').slice(0,16))||('bosas'+Date.now());
    const def={ type:ED.type, key, name:ED.name.trim(), desc:ED.desc.trim(), hp:ED.type==='event'?(+ED.hp||300):200, emo:ED.emo||'👾', taunts:ED.taunts?ED.taunts.split('\n').map(s=>s.trim()).filter(Boolean):[], rects:[{x:3,y:30,w:26,h:2,color:'#00000038'}].concat(r) };
    save.innerHTML='<span class="spin"></span>';
    const {data,error}=await sb.rpc('admin_save_boss',{p_def:def});
    if(error){toast('Klaida: '+error.message); save.textContent='💾 Išsaugoti bosą'; return;}
    CUSTOM_BOSSES.push({id:data,def}); edReset(); toast('Bosas išsaugotas!'); BOSS_SUB='gallery'; renderBoss(v);
  };
  right.appendChild(save);
  wrap.appendChild(right);
  card.appendChild(wrap); v.appendChild(card);
}

/* ---------- TEISĖS ---------- */
function renderRights(v){
  const s=STATS, b=el('div','bento');
  const intro=el('div','card c12');
  intro.appendChild(el('div','info',svg('info')+'<div>Kol kas mokamų funkcijų nėra — tai paruoštas karkasas. Suteikta teisė iškart įrašoma serveryje; kai pridėsim mokamą funkciją, programėlė tikrins šias teises.</div>'));
  b.appendChild(intro);

  const pick=el('div','card c5');
  pick.innerHTML='<h3>Pasirink šeimą</h3><div class="h3sub">Valdyk konkrečios šeimos prieigą</div>';
  const sel=el('select'); sel.innerHTML='<option value="">— pasirink —</option>'+s.familyRows.map(r=>'<option value="'+esc(r.code)+'">'+esc(r.name)+' ('+esc(r.code)+')</option>').join('');
  pick.appendChild(sel);
  const summary=el('div'); summary.style.marginTop='14px'; pick.appendChild(summary);
  b.appendChild(pick);

  const panel=el('div','card c7');
  panel.innerHTML='<h3>Funkcijos</h3><div class="h3sub">Įjunk arba išjunk pasirinktai šeimai</div>';
  const feat=el('div'); panel.appendChild(feat); b.appendChild(panel);
  v.appendChild(b);

  function drawFeat(){
    feat.innerHTML=''; summary.innerHTML='';
    const code=sel.value;
    if(!code){ feat.appendChild(el('div','empty',svg('key')+'<div class="muted" style="font-size:.85rem">Pasirink šeimą kairėje.</div>')); return; }
    const row=s.familyRows.find(r=>r.code===code);
    if(row) summary.innerHTML='<div class="statrow" style="border:none;padding:6px 0"><span class="avatar" style="background:'+avatarColor(code)+'">'+esc((row.name||'?').charAt(0).toUpperCase())+'</span><span class="n"><b>'+esc(row.name)+'</b><br><span class="muted" style="font-size:.78rem">'+row.members+' nariai · '+(row.owner?esc(row.owner):'vaiko prieiga')+'</span></span></div>';
    const cur=new Set(s.ents.filter(e=>e.family_code===code&&e.enabled).map(e=>e.feature));
    FEATURES.forEach(f=>{
      const on=cur.has(f.key);
      const sw=el('div','switch','<div><div class="nm">'+esc(f.name)+'</div><div class="ky">'+esc(f.key)+'</div></div>');
      const tg=el('button','tgl'+(on?' on':'')); tg.setAttribute('aria-label',f.name);
      tg.onclick=async()=>{ tg.style.opacity=.5;
        const {error}=await sb.rpc('admin_set_entitlement',{p_family:code,p_feature:f.key,p_enabled:!on});
        tg.style.opacity=1;
        if(error){toast('Klaida: '+error.message);return;}
        const idx=s.ents.findIndex(e=>e.family_code===code&&e.feature===f.key);
        if(idx>=0)s.ents[idx].enabled=!on; else s.ents.push({family_code:code,feature:f.key,enabled:!on});
        s.paying=new Set(s.ents.filter(e=>e.enabled).map(e=>e.family_code)).size; updateNavCounts();
        toast(!on?'Teisė suteikta':'Teisė atimta'); drawFeat();
      };
      sw.appendChild(tg); feat.appendChild(sw);
    });
  }
  sel.onchange=drawFeat; drawFeat();
}

/* ====================== PALEIDIMAS ====================== */
$('loginBtn').onclick=doLogin;
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('refreshBtn').onclick=loadAll;
$('logoutBtn').onclick=logout;
(async()=>{ const {data}=await sb.auth.getSession();
  if(data.session&&(data.session.user.email||'').toLowerCase()===ADMIN_EMAIL) enterApp();
})();
</script>
